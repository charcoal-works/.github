name: Feature request
description: Suggest an improvement or a new capability.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Charcoal IPA
        - Charcoal APK
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: A concrete workflow or pain point, not just a missing feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other tools.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request does not involve DRM circumvention or paid-content bypass.
          required: true
